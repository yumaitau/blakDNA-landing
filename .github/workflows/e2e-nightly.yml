name: E2E nightly
# Playwright journeys and Lighthouse run here only, never in push or pull-request CI.
on:
  schedule:
    # 15:00 UTC = 02:00 AEDT / 01:00 AEST
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-e2e-nightly
  cancel-in-progress: true
jobs:
  e2e:
    name: Homelab browser journey
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds Dockerfile.test (pnpm build, test, test:site) and runs Playwright and Lighthouse in it.
      - run: pnpm test:homelab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: landing-evidence
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 14
